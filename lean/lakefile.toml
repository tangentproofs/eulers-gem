name = "eulers-gem"
defaultTargets = ["EulersGem", "Results"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "09a9e06e4e5ccd5b783f25e52ad3ebecfb1e2d68"

[[lean_lib]]
name = "EulersGem"
globs = ["EulersGem.+"]

[[lean_lib]]
name = "Results"

# Quarantined gaps of the Platonic classification: contains `sorry` on purpose.
# Not a default target and not imported by `EulersGem` or `Results`.
[[lean_lib]]
name = "PlatonicGaps"
